# Native Streamlit theme, mirroring the brand palette that used to live only
# in src/components/theme.py's hardcoded CSS. Defining both [theme.light] and
# [theme.dark] lets users toggle dark mode from the app menu (Settings ->
# Choose app theme); src/components/theme.py reads st.context.theme.type to
# keep its custom cards/tabs/sidebar CSS in sync with whichever one is active.
[theme.light]
primaryColor = "#0284c7"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
borderColor = "#e2e8f0"
linkColor = "#0284c7"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "10px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

greenColor = "#10b981"
greenBackgroundColor = "#ecfdf5"
greenTextColor = "#065f46"
orangeColor = "#f59e0b"
orangeBackgroundColor = "#fffbeb"
orangeTextColor = "#92400e"
redColor = "#ef4444"
redBackgroundColor = "#fef2f2"
redTextColor = "#991b1b"

[theme.light.sidebar]
backgroundColor = "#ffffff"
borderColor = "#e2e8f0"

[theme.dark]
primaryColor = "#38bdf8"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"
linkColor = "#38bdf8"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "10px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

greenColor = "#10b981"
greenBackgroundColor = "#052e2b"
greenTextColor = "#6ee7b7"
orangeColor = "#f59e0b"
orangeBackgroundColor = "#451a03"
orangeTextColor = "#fcd34d"
redColor = "#ef4444"
redBackgroundColor = "#450a0a"
redTextColor = "#fca5a5"

[theme.dark.sidebar]
backgroundColor = "#1e293b"
borderColor = "#334155"
